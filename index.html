<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#581c87">
  <title>DCA WCHR Radio</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0f172a;color:#fff;font-family:Arial,sans-serif}
    .app{max-width:520px;margin:0 auto;padding:16px}
    .head{background:#5b168f;border-radius:18px;padding:18px;margin-bottom:16px}
    .head h1{margin:0 0 10px;font-size:28px}
    .device{font-size:22px}
    .muted{opacity:.72}
    .version{margin-top:4px;font-size:13px;opacity:.72}
    .card{background:#1e293b;border-radius:16px;padding:18px;margin-bottom:16px}
    .card h2{margin:0 0 14px;font-size:22px}
    label{display:block;font-weight:800;font-size:18px;margin:12px 0 6px}
    input,select{display:block;width:100%;font-size:18px;padding:14px;border:2px solid transparent;border-radius:12px;background:#fff;color:#111}
    input:focus,select:focus{outline:none;border-color:#a855f7}
    button{font-family:inherit}
    .primary{display:block;width:100%;margin-top:18px;padding:16px;border:0;border-radius:12px;background:#22c55e;color:#052e16;font-size:20px;font-weight:900}
    .secondary{display:block;width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;background:#334155;color:#fff;font-size:16px;font-weight:800}
    .danger{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:#7f1d1d;color:#fff;font-size:16px;font-weight:900}
    .hidden{display:none!important}
    .status{padding:12px;border-radius:10px;background:#111827;margin-bottom:12px}
    .ok{color:#86efac}
    .ptt{display:block;width:100%;height:126px;margin-top:12px;border:0;border-radius:18px;background:#7e22ce;color:#fff;font-size:22px;font-weight:900;touch-action:none;-webkit-user-select:none;user-select:none}
    .ptt.tx{background:#b91c1c}
    .diag{font-size:13px;line-height:1.4;margin-top:10px;padding:10px;border-radius:9px;background:#111827;color:#cbd5e1;white-space:pre-wrap}
    iframe.radio-frame{position:fixed;width:2px;height:2px;left:-20px;top:-20px;border:0;opacity:.01;pointer-events:none}
    .assignment-card{background:#3b0764;border:2px solid #a855f7}
    .assignment-card h2{margin-bottom:8px}
    .assignment-details{font-size:20px;font-weight:900;line-height:1.35;margin:10px 0}
    .assignment-state{padding:10px;border-radius:9px;background:#111827;color:#86efac;font-weight:900;margin:10px 0}
    .assignment-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .assignment-actions button{padding:14px 8px;border:0;border-radius:10px;font-size:15px;font-weight:900}
    .assignment-accept{background:#22c55e;color:#052e16}
    .assignment-at{background:#38bdf8;color:#082f49}
    .assignment-start{background:#f59e0b;color:#451a03}
    .assignment-complete{background:#16a34a;color:#fff}
  </style>
</head>
<body>
<div class="app">
  <section class="head">
    <h1>🎙 DCA WCHR RADIO</h1>
    <div class="device">TEST</div>
    <div id="shiftSummary" class="muted">No employee signed in</div>
    <div class="version">Phone App v0.7.0 ASSIGNMENT TEST</div>
  </section>

  <section id="startCard" class="card">
    <h2>START SHIFT</h2>

    <label for="employeeName">Employee name</label>
    <input id="employeeName" type="text" autocomplete="name" placeholder="Enter your name">

    <label for="employeeRole">Role</label>
    <select id="employeeRole">
      <option value="AGENT">WCHR Agent</option>
      <option value="SUPERVISOR">Supervisor</option>
    </select>

    <button id="startShift" type="button" class="primary">START SHIFT</button>
    <div id="formMessage" class="diag">Page ready. Name field and role selector should be active.</div>
  </section>

  <section id="assignmentCard" class="card assignment-card hidden">
    <h2 id="assignmentTitle">📟 NEW ASSIGNMENT</h2>
    <div id="assignmentDetails" class="assignment-details">Wheelchair assignment</div>
    <div id="assignmentPhoneStatus" class="assignment-state">ANNOUNCED</div>
    <div class="assignment-actions">
      <button id="assignmentAccept" class="assignment-accept">ACCEPT</button>
      <button id="assignmentAt" class="assignment-at">AT LOCATION</button>
      <button id="assignmentStart" class="assignment-start">START SERVICE</button>
      <button id="assignmentComplete" class="assignment-complete">COMPLETE</button>
    </div>
  </section>

  <section id="radioCard" class="card hidden">
    <h2>RADIO</h2>
    <div id="radioStatus" class="status ok"><b>RADIO CONNECTING…</b></div>
    <div id="roomStatus" class="muted"></div>
    <button id="enableAudio" type="button" class="secondary">🔊 ENABLE RADIO AUDIO</button>

    <button id="pttDispatch" type="button" class="ptt">TALK TO<br>DISPATCH</button>

    <div id="supervisorControls" class="hidden">
      <button id="pttAll" type="button" class="ptt">TALK TO<br>ALL WCHR</button>
    </div>

    <button id="endShift" type="button" class="danger">END SHIFT</button>
    <button id="showDiag" type="button" class="secondary">SHOW DIAGNOSTICS</button>
    <div id="radioDiag" class="diag hidden"></div>
  </section>
</div>

<iframe id="dispatchAllView" class="radio-frame" allow="autoplay *"></iframe>
<iframe id="privateView" class="radio-frame" allow="autoplay *"></iframe>
<iframe id="supervisorFrame" class="radio-frame" allow="microphone *; autoplay *"></iframe>
<iframe id="dispatchTxFrame" class="radio-frame" allow="microphone *; autoplay *"></iframe>


<script src="app.js?v=070"></script>
</body>
</html>
